<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link href="https://fonts.googleapis.com/css?family=Orbitron" rel="stylesheet">
    <link rel="shortcut icon" href="favicon/favicon.ico" type="image/x-icon">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora</h1>
    <main>
                <div id="calculadora">
                    <div id="visor">
                        <p id="numvisor">0</p>
                    </div>
                    <div id="botoes">
                        <button>1</button>
                        <button>2</button>
                        <button>3</button>
                        <button id="limpar">C</button>
                        <button>4</button>
                        <button>5</button>
                        <button>6</button>
                        <button id="dividir">&divide;</button>
                        <button>7</button>
                        <button>8</button>
                        <button>9</button>
                        <button id="vezes">&times;</button>
                        <button>0</button>
                        <button id="menos">&minus;</button>
                        <button id="mais">&plus;</button>
                        <button id="igual">&equals;</button>
                    </div>
                </div>
    </main>

    <footer>
        Site criado por: João Pedro de Oliveira Nestor
    </footer>


    <script src="script.js"></script>
</body>
</html>
